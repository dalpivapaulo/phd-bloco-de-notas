      - name: Salvar código v15 no repositório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar correção consolidada v15" || true
          git push

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar dependências oficiais
        run: npm install --no-audit --no-fund

      - name: Sincronizar Capacitor e plugins oficiais
        run: npm run android:sync

      - name: Definir versão verificável
        shell: bash
        run: |
          VERSION_CODE=$((150000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.15.${GITHUB_RUN_NUMBER}"
          export VERSION_CODE VERSION_NAME
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s,n1=re.subn(r'versionCode\s+\d+',f'versionCode {os.environ["VERSION_CODE"]}',s,count=1)
          s,n2=re.subn(r'versionName\s+"[^"]+"',f'versionName "{os.environ["VERSION_NAME"]}"',s,count=1)
          if not (n1 and n2):
              raise SystemExit("Falha ao definir versionCode/versionName")
          p.write_text(s)
          print(os.environ["VERSION_NAME"],os.environ["VERSION_CODE"])
          PY

      - name: Restaurar chave de assinatura
        shell: bash
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || (echo "Secret ANDROID_KEYSTORE_BASE64 ausente" && exit 1)
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/phd-notas-release.jks

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Assinar e validar APK
        shell: bash
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="android/app/build/outputs/apk/release/PHD-Notas-aligned.apk"
          SIGNED="android/app/build/outputs/apk/release/PHD-Notas.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks android/app/phd-notas-release.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"

      - name: Publicar APK no site
        shell: bash
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/release/PHD-Notas.apk downloads/PHD-Notas.apk

          cat > downloads/version.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "runNumber": ${GITHUB_RUN_NUMBER},
            "commit": "$(git rev-parse HEAD)",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          git add downloads/PHD-Notas.apk downloads/version.json
          git commit -m "Publicar PHD Notas ${VERSION_NAME}" || true
          git push
