name: Gerar pasta Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Gerar pasta android
        run: |
          if [ -d "android" ]; then
            echo "A pasta android já existe."
            exit 0
          fi
          npm run android:add

      - name: Salvar pasta android no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android package-lock.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi
          git commit -m "Gerar estrutura Android com Capacitor"
          git push
