          json.load(open("package.json"))
          json.load(open("capacitor.config.json"))
          ET.parse("android/app/src/main/AndroidManifest.xml")
          html=open("index.html",encoding="utf-8").read()
          src=open("src/app-entry.js",encoding="utf-8").read()
          assert 'id="remTime" type="time" step="60"' in html
          assert 'id="remNotify" type="checkbox" checked' in html
          assert 'id="remWakeScreen" type="checkbox" checked' in html
          assert 'id="appVersion"' in html
          assert 'Salvar lembrete' in html
          assert '@capacitor/local-notifications' in src
          assert 'registerPlugin("PHDVoice")' in src
          assert 'window.webkitSpeechRecognition' not in src
          assert 'window.SpeechRecognition' not in src
          print("Arquivos fonte v16 validados.")
          PY

      - name: Instalar dependências e gerar bundle
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run bundle
          node --check app.js
          grep -q "LocalNotifications" app.js || (echo "ERRO: plugin de notificações não entrou no bundle" && exit 1)
          grep -q "PHDVoice" app.js || (echo "ERRO: plugin de voz não entrou no bundle" && exit 1)

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Sincronizar Capacitor
        run: npm run android:sync

      - name: Validar plugins Android
        shell: bash
        run: |
          test -f android/app/src/main/java/io/github/dalpivapaulo/phdnotas/PHDVoicePlugin.java
          grep -q 'registerPlugin(PHDVoicePlugin.class)' android/app/src/main/java/io/github/dalpivapaulo/phdnotas/MainActivity.java
          grep -q 'USE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
          grep -q 'phd_alert.wav' capacitor.config.json
          echo "Integração nativa v16 validada."

      - name: Definir versão verificável
        shell: bash
        run: |
          VERSION_CODE=$((160000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.16.${GITHUB_RUN_NUMBER}"
          export VERSION_CODE VERSION_NAME
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s,n1=re.subn(r'versionCode\s+\d+',f'versionCode {os.environ["VERSION_CODE"]}',s,count=1)
          s,n2=re.subn(r'versionName\s+"[^"]+"',f'versionName "{os.environ["VERSION_NAME"]}"',s,count=1)
          if not (n1 and n2):
              raise SystemExit("Falha ao definir versionCode/versionName")
          p.write_text(s)
          print(os.environ["VERSION_NAME"],os.environ["VERSION_CODE"])
          PY

      - name: Restaurar chave de assinatura
        shell: bash
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || (echo "Secret ANDROID_KEYSTORE_BASE64 ausente" && exit 1)
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/phd-notas-release.jks

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Assinar e validar APK
        shell: bash
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="android/app/build/outputs/apk/release/PHD-Notas-aligned.apk"
          SIGNED="android/app/build/outputs/apk/release/PHD-Notas.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks android/app/phd-notas-release.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"

      - name: Publicar e salvar v16 no repositório
        shell: bash
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/release/PHD-Notas.apk downloads/PHD-Notas.apk

          cat > downloads/version.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "runNumber": ${GITHUB_RUN_NUMBER},
            "commitBase": "$(git rev-parse HEAD)",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          rm -f android/app/phd-notas-release.jks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json capacitor.config.json index.html styles.css service-worker.js app.js src android downloads
          git commit -m "Aplicar v16 consolidada e publicar ${VERSION_NAME}" || true
          git push
