name: Bip lembrete curto v16.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Alterar somente o som do aviso
        shell: bash
        run: |
          set -e
          test -f android/app/src/main/res/raw/phd_alert.wav
          test -f index.html

          echo '' | base64 --decode > android/app/src/main/res/raw/phd_alert.wav

          python3 - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Ajusta apenas o texto descritivo do som, sem tocar em qualquer função.
          candidatos = [
              "Bipe curto de 3 segundos",
              "Bipe curto de 2 segundos",
              "Aviso sonoro curto"
          ]
          encontrados = [x for x in candidatos if x in s]

          if len(encontrados) > 1:
              raise SystemExit("SEGURANÇA: mais de um texto de aviso encontrado.")
          if len(encontrados) == 1 and encontrados[0] != "Aviso sonoro curto":
              s = s.replace(encontrados[0], "Aviso sonoro curto", 1)
              p.write_text(s, encoding="utf-8")

          print("Som substituído por bip-lembrete curto (~0,72 s).")
          PY

      - name: Validar alteração mínima
        shell: bash
        run: |
          set -e
          CHANGED="$(git diff --name-only | sort)"
          printf '%s\n' "$CHANGED"

          # Antes da versão/build, somente estes arquivos podem ter mudado.
          ALLOWED1="android/app/src/main/res/raw/phd_alert.wav"
          ALLOWED2="index.html"

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ "$f" != "$ALLOWED1" ] && [ "$f" != "$ALLOWED2" ]; then
              echo "ERRO DE SEGURANÇA: alteração não autorizada em $f"
              exit 1
            fi
          done <<< "$CHANGED"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Copiar web para Android
        run: npx cap copy android

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Definir versão v16.3
        shell: bash
        run: |
          VERSION_CODE=$((163000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.16.3.${GITHUB_RUN_NUMBER}"
          export VERSION_CODE VERSION_NAME
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          s,n1 = re.subn(r'versionCode\s+\d+', f'versionCode {os.environ["VERSION_CODE"]}', s, count=1)
          s,n2 = re.subn(r'versionName\s+"[^"]+"', f'versionName "{os.environ["VERSION_NAME"]}"', s, count=1)

          if not (n1 and n2):
              raise SystemExit("Falha ao atualizar somente a versão.")

          p.write_text(s, encoding="utf-8")
          PY

      - name: Restaurar chave de assinatura
        shell: bash
        run: |
          set -e
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || (echo "Secret ANDROID_KEYSTORE_BASE64 ausente" && exit 1)
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/phd-notas-release.jks

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Assinar e validar APK
        shell: bash
        run: |
          set -e
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="android/app/build/outputs/apk/release/PHD-Notas-aligned.apk"
          SIGNED="android/app/build/outputs/apk/release/PHD-Notas.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign             --ks android/app/phd-notas-release.jks             --ks-key-alias "$ANDROID_KEY_ALIAS"             --ks-pass env:ANDROID_KEYSTORE_PASSWORD             --key-pass env:ANDROID_KEY_PASSWORD             --out "$SIGNED"             "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"

      - name: Publicar v16.3
        shell: bash
        run: |
          set -e

          mkdir -p downloads
          cp android/app/build/outputs/apk/release/PHD-Notas.apk downloads/PHD-Notas.apk

          cat > downloads/version.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "runNumber": ${GITHUB_RUN_NUMBER},
            "change": "somente-bip-lembrete-curto",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          rm -f android/app/phd-notas-release.jks

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             index.html             android/app/src/main/res/raw/phd_alert.wav             android/app/build.gradle             downloads/PHD-Notas.apk             downloads/version.json

          git commit -m "v16.3: bip lembrete curto"
          git push
